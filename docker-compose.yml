services:
  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    user: root
    volumes:
      - ./alloy.hcl:/etc/alloy/config.hcl
      - /data/logs:/data/logs
    env_file:
      - .env
    command:
      - run
      - /etc/alloy/config.hcl
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
